{% assign search_path = '/search/' %}
<dialog class="site-search-overlay" data-site-search-overlay data-site-search-index="{{ '/search.json' | relative_url | append: cacheBust }}" aria-labelledby="site-search-title" hidden aria-hidden="true">
  <div class="site-search-dialog design-card">
    <form class="site-search" data-site-search data-site-search-writer action="{{ search_path | relative_url }}" method="get" role="search">
      <div class="site-search-bar">
        <label class="site-search-label" for="site-search-modal-input" id="site-search-title">Search</label>
        <input
          type="text"
          class="design-input site-search-input"
          name="q"
          id="site-search-modal-input"
          data-site-search-input
          placeholder="Search docs, pricing, encrypt…"
          inputmode="search"
          enterkeyhint="search"
          autocomplete="off"
          data-1p-ignore="true"
          data-lpignore="true"
          data-bwignore="true"
          data-form-type="other"
        >
        {% include components/design-kbd.html key="/" class="site-search-kbd" %}
      </div>
      <div class="site-search-results" data-site-search-results aria-live="polite"></div>
    </form>
  </div>
</dialog>
<script src="{{ '/assets/js/site-search.js' | relative_url | append: cacheBust }}" defer></script>
