{% comment %}Reusable vault door. The parent SVG supplies the container's end-face perspective.{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 255.0616" width="240" height="255.0616" role="img" aria-label="Steel vault door">
  <!-- The frame replaces the entire end face, including the original door hardware. -->
  <path d="M0 0H240V255.0616H0Z" fill="#282D33" stroke="#737B85" stroke-width="2" />
  <path d="M0 0H240L220 20H20Z" fill="#7B838D" />
  <path d="M240 0V255.0616L220 235.0616V20Z" fill="#4A515B" />
  <path d="M0 255.0616V0L20 20V235.0616Z" fill="#414851" />
  <path d="M0 255.0616H240L220 235.0616H20Z" fill="#191D22" />
  <rect x="20" y="20" width="200" height="215.0616" rx="5" fill="#080A0D" stroke="#939BA5" stroke-width="1.5" />
  <rect x="27" y="27" width="186" height="201.0616" rx="4" fill="#414850" stroke="#626B76" stroke-width="2" />
  <path d="M35 220V35H205" fill="none" stroke="#7A8490" stroke-width="1.5" />
  <!-- Two broad hinges read as working hardware at icon size. -->
  <g fill="#747D87" stroke="#242A31" stroke-width="2">
    <rect x="15" y="52" width="27" height="32" rx="4" />
    <rect x="15" y="171" width="27" height="32" rx="4" />
  </g>
  <path d="M24 57V79M24 176V198" stroke="#B0B7BF" stroke-width="2" stroke-linecap="round" />

  <circle cx="125" cy="133" r="52" fill="#242A31" />
  <circle cx="120" cy="127.5" r="47" fill="none" stroke="#151A20" stroke-width="13" />
  <g fill="none" stroke="#B1B9C2" stroke-width="8" stroke-linecap="round">
    <circle cx="120" cy="127.5" r="43" />
    <path d="M120 84.5V170.5M77 127.5H163" />
  </g>
  <circle cx="120" cy="127.5" r="14" fill="#737E8A" stroke="#D0D5DB" stroke-width="3" />
  <circle cx="120" cy="127.5" r="5" fill="#363F49" />
</svg>
