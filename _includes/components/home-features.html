<section class="radar-section" aria-label="{{ site.data.features.title }}">
  <div class="armor-shell">
    <div class="design-list">
      <p class="design-list-title">{{ site.data.features.title }}</p>
      <ul class="design-list-items">
        {%- for item in site.data.features.items %}
        <li>
          <a class="design-link" href="{{ item.href }}">{{ item.label }}</a>
          {%- if item.meta %}
          <span class="design-list-meta">{{ item.meta }}</span>
          {%- endif %}
        </li>
        {%- endfor %}
      </ul>
    </div>
  </div>
</section>
