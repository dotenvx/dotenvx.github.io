<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ page.title | escape }}</title>
  <script src="{{ '/assets/js/writer-mode.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/writer.css' | relative_url }}">
</head>
<body>
  <header class="writer-nav">
    <a class="writer-nav-home" href="{{ '/v2/' | relative_url }}">
      <img src="{{ '/assets/img/logo-env.svg' | relative_url }}" alt="" width="22" height="22">
      Dotenvx
    </a>
    <nav class="writer-nav-links" aria-label="Primary">
      <a href="{{ '/v2/' | relative_url }}"{% if page.url == '/v2/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/docs' | relative_url }}">Docs</a>
      <a href="{{ '/v2/pricing/' | relative_url }}"{% if page.url == '/v2/pricing/' %} aria-current="page"{% endif %}>Pricing</a>
      <a href="{{ '/v2/agents/' | relative_url }}"{% if page.url == '/v2/agents/' %} aria-current="page"{% endif %}>Agents</a>
    </nav>
    <div class="writer-nav-actions">
      <button type="button" class="writer-nav-mode" data-writer-mode-toggle aria-label="Dark mode" aria-keyshortcuts="M" aria-pressed="false" title="Toggle light or dark mode (M)">[m]</button>
      <a class="writer-nav-login" href="{{ '/login' | relative_url }}">Login</a>
    </div>
  </header>
  <main class="writer">
    {{ content }}
  </main>
  <footer class="writer-footer">
    <p>{{ site.data.footer.title }}</p>
    <nav aria-label="Footer">
      <ul>
        {% for link in site.data.footer.links %}
          <li>
            {% if link.theme_toggle %}
              <button type="button" data-writer-mode-toggle aria-label="Dark mode" aria-pressed="false">{{ link.label }}</button>
            {% else %}
              <a href="{% if link.href == '/' %}{{ '/v2/' | relative_url }}{% elsif link.href == '/agents' or link.href == '/pricing' %}{{ link.href | prepend: '/v2' | append: '/' | relative_url }}{% elsif link.href contains '://' %}{{ link.href }}{% else %}{{ link.href | relative_url }}{% endif %}"{% if link.external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </footer>
  <script src="{{ '/assets/js/design-choice.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/writer-copy.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
