<div class="design-secret-row">
  <div class="design-secret-pair">
    <input class="design-input design-secret-field design-secret-key" type="text" value="{{ include.key | escape }}" aria-label="Variable name" readonly spellcheck="false">
    <input class="design-input design-secret-field design-secret-value" type="{% if include.secret %}password{% else %}text{% endif %}" value="{{ include.value | escape }}" aria-label="{{ include.key | escape }} value{% if include.secret %}; focus to reveal{% endif %}" readonly autocomplete="off" spellcheck="false"{% if include.secret %} data-secret-example-value data-1p-ignore data-lpignore="true"{% endif %}>
  </div>
</div>
