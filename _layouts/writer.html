<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ page.title | escape }}</title>
  <script src="{{ '/assets/js/writer-mode.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/writer.css' | relative_url }}">
</head>
<body>
  {% capture writer_links %}
    <a href="{{ '/preview/writer/' | relative_url }}"{% if page.url == '/preview/writer/' or page.url == '/preview/writer/index.html' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/docs' | relative_url }}">Docs</a>
    <a href="{{ '/pricing' | relative_url }}">Pricing</a>
    <a href="{{ '/agents' | relative_url }}">Agents</a>
  {% endcapture %}
  <header class="writer-nav">
    <div class="writer-nav-brand">
      <a class="writer-nav-home" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/img/logo-env.svg' | relative_url }}" alt="" width="22" height="22">
        Dotenvx
      </a>
      <button type="button" class="writer-sidebar-toggle" data-writer-sidebar-toggle aria-label="Sidebar" aria-controls="writer-sidebar" aria-expanded="true" title="Hide sidebar">[-]</button>
    </div>
    <div class="writer-nav-actions">
      <button type="button" class="writer-nav-mode" data-writer-mode-toggle aria-label="Dark mode" aria-keyshortcuts="M" aria-pressed="false" title="Toggle light or dark mode (M)">[m]</button>
      <a class="writer-nav-login" href="{{ '/login' | relative_url }}">Login</a>
    </div>
  </header>
  <div class="writer-frame">
    <nav id="writer-sidebar" class="writer-sidebar" aria-label="Primary">
      {{ writer_links }}
    </nav>
    <details class="writer-mobile-menu">
      <summary>Menu</summary>
      <nav aria-label="Primary">{{ writer_links }}</nav>
    </details>
    <main class="writer">
      {{ content }}
    </main>
  </div>
  <script src="{{ '/assets/js/design-choice.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/writer-copy.js' | relative_url }}" defer></script>
</body>
</html>
