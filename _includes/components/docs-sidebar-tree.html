{% for node in include.nodes %}
  <li>
    {% if node.href %}
      <a class="{% if node.children != empty %}docs-sidebar-group{% else %}design-link{% endif %}" href="{{ node.href | relative_url }}"{% if node.new_tab %} target="_blank" rel="noopener noreferrer"{% endif %}{% if node.href == page.url %} aria-current="page"{% endif %}>{{ node.label | escape }}</a>
    {% else %}
      <span class="docs-sidebar-group">{{ node.label | escape }}</span>
    {% endif %}
    {% if node.children != empty %}
      <ul>{% include components/docs-sidebar-tree.html nodes=node.children %}</ul>
    {% endif %}
  </li>
{% endfor %}
