<style>
  /* Sparse ascii visual — don't inherit the 17rem/23rem hero media slot */
  .pricing-design-hero .design-hero-visual {
    min-height: 8.5rem;
  }

  .pricing-hero-ascii {
    align-items: center;
    display: flex;
    height: 100%;
    justify-content: center;
    min-height: inherit;
    width: 100%;
  }

  .pricing-hero-ascii-art {
    color: var(--design-ink);
    font-family: var(--design-font-mono);
    font-size: clamp(0.72rem, 1.6vw, 0.95rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0;
    text-align: center;
    user-select: none;
    white-space: pre;
  }

  @media (min-width: 900px) {
    .pricing-design-hero .design-hero-visual {
      min-height: 23rem;
    }

    .pricing-hero-ascii {
      height: 100%;
      min-height: inherit;
    }
  }
</style>

{% capture pricing_hero_visual %}
  <div class="pricing-hero-ascii" aria-hidden="true">
    <pre class="pricing-hero-ascii-art">$5 ── $20 ── $90 ── ∞</pre>
  </div>
{% endcapture %}

{% include components/design-hero.html
  class="pricing-design-hero"
  eyebrow="Armor ⛨"
  title="Pricing"
  description="Dotenvx is free and open source. But you can pay for Dotenvx Armor."
  visual=pricing_hero_visual
%}
