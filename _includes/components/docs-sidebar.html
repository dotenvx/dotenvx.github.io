<aside class="docs-sidebar" aria-label="Documentation navigation">
  <button class="docs-drawer-toggle" type="button" aria-label="Open documentation navigation" aria-controls="docs-drawer" aria-expanded="false">
    <span class="docs-drawer-glyph" aria-hidden="true">◨</span>
  </button>
  <dialog id="docs-drawer" class="docs-drawer" aria-label="Documentation navigation">
    <div class="docs-drawer-header"><span>Documentation</span><button class="docs-drawer-close" type="button" aria-label="Close documentation navigation">×</button></div>
  </dialog>
  <details class="docs-sidebar-disclosure" open>
    <summary>Documentation navigation</summary>
    <nav class="docs-sidebar-scroll" aria-label="All docs">
      <ul>{% include components/docs-sidebar-tree.html nodes=site.data.docs_navigation %}</ul>
    </nav>
  </details>
  <div class="docs-sidebar-resizer" role="separator" aria-label="Resize documentation sidebar" aria-orientation="vertical" tabindex="0" title="Drag to resize. Double-click to reset."></div>
</aside>
<script src="{{ '/assets/js/docs-sidebar.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
