<section class="radar-hero feature-hero">
  <div class="radar-shell feature-shell">
    <p class="radar-kicker">Feature</p>
    <h1 class="radar-title feature-title">{{ include.heading }}</h1>
    <p class="radar-lede feature-lede">{{ include.description }} {{ include.subdescription }}</p>
  </div>
</section>

<section class="radar-section feature-media-section">
  <div class="radar-shell feature-shell">
    <div class="feature-video-frame">
      <div class="feature-video-toolbar" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="feature-video-stage">
        <video class="feature-video" controls playsinline preload="metadata">
          <source src="{{ include.video }}" type="video/mp4">
          your browser does not support the video tag
        </video>
      </div>
    </div>
  </div>
</section>
