<style>
  /* Sparse ascii visual — don't inherit the 17rem/23rem hero media slot */
  .legal-design-hero .design-hero-visual {
    min-height: 8.5rem;
  }

  .legal-hero-ascii {
    align-items: center;
    display: flex;
    height: 100%;
    justify-content: center;
    min-height: inherit;
    width: 100%;
  }

  .legal-hero-ascii-art {
    color: var(--design-ink);
    font-family: var(--design-font-mono);
    font-size: clamp(0.95rem, 2vw, 1.35rem);
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.2;
    margin: 0;
    text-align: center;
    user-select: none;
    white-space: pre;
  }

  @media (min-width: 900px) {
    .legal-design-hero .design-hero-visual {
      min-height: 23rem;
    }

    .legal-hero-ascii {
      height: 100%;
      min-height: inherit;
    }
  }
</style>

{% capture legal_hero_visual %}
  <div class="legal-hero-ascii" aria-hidden="true">
    <pre class="legal-hero-ascii-art">───────✎</pre>
  </div>
{% endcapture %}

{% include components/design-hero.html
  class="legal-design-hero"
  eyebrow=include.eyebrow
  title=include.title
  description=include.description
  visual=legal_hero_visual
%}
