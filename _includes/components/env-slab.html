<figure class="env-slab" data-env-slab="{% if include.plaque %}plaque{% endif %}">
  <div class="env-slab-stage" tabindex="0" role="{% if include.plaque %}img{% else %}button{% endif %}" aria-label="{% if include.plaque %}Solid silver-finish desk cube with softened edges and recessed .ENV lettering low on its front face. Hover to lift it slightly.{% else %}Silver Dotenv slab with recessed .ENV lettering on the front and centered SM initials on the back. Hover or focus to reveal SM; move away to return to .ENV. Tap to toggle. Click or press Enter for a gentle downward press.{% endif %}">
  </div>
</figure>
<script type="module" src="/assets/js/env-slab.js?v={{ site.time | date: '%s' }}"></script>
