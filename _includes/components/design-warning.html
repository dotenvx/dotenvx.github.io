{% comment %}
  Expandable warning. Pass title and captured content.
  Set markdown=true for Markdown content; open=true to expand initially.
{% endcomment %}
<details class="design-warning"{% if include.open %} open{% endif %}>
  <summary class="design-paragraph"><span aria-hidden="true">⚠</span> {{ include.title | escape }}</summary>
  <div class="design-warning-body">
    {% if include.markdown %}{{ include.content | markdownify }}{% else %}{{ include.content }}{% endif %}
  </div>
</details>
