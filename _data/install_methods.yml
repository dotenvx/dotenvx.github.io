- name: CLI
  id: curl
  command: curl -sfS https://dotenvx.sh | sh
  prompt: Install the Dotenvx CLI using the official shell installer at https://dotenvx.sh. Check that this method suits my operating system, run the installer, and verify with dotenvx --version. Do not change my .env files.
- name: NPM
  command: npm install @dotenvx/dotenvx
  prompt: Install @dotenvx/dotenvx in this project using npm. Inspect the package setup first, add the dependency, and verify with npx dotenvx --version. Do not change my .env files or application code.
- name: Windows
  command: winget install dotenvx
  prompt: Install the Dotenvx CLI on Windows using winget install dotenvx. Check whether it is already installed, install if needed, and verify with dotenvx --version. Do not change my .env files.
- name: Brew
  command: |-
    brew tap dotenvx/brew
    brew trust dotenvx/brew
    brew install dotenvx
  prompt: Install the Dotenvx CLI using Homebrew. Check that Homebrew is available, run brew tap dotenvx/brew, brew trust dotenvx/brew, and brew install dotenvx, then verify with dotenvx --version. Do not change my .env files.
- name: GitHub Releases
  id: github
  command: |-
    curl -L -o dotenvx.tar.gz "https://github.com/dotenvx/dotenvx/releases/latest/download/dotenvx-$(uname -s)-$(uname -m).tar.gz"
    tar -xzf dotenvx.tar.gz
    ./dotenvx help
  prompt: Install the Dotenvx CLI from the latest official GitHub release at https://github.com/dotenvx/dotenvx/releases. Detect my operating system and architecture, download and extract the matching binary, put it in an appropriate location on my PATH, and verify with dotenvx --version. Do not change my .env files.
- name: Docker
  command: docker run --rm -v "$(pwd):/app" dotenv/dotenvx help
  prompt: Use the official dotenv/dotenvx Docker image. Check that Docker is available, pull the image, and verify it with docker run --rm dotenv/dotenvx --version. Mount my project at /app when running project commands. Do not change my .env files.
- name: Standalone
  command: |-
    curl -sfS --proto '=https' "https://dotenvx.sh/$(uname)/$(uname -m).tgz" | tar xz
    sudo install -m 755 dotenvx /usr/local/bin
    dotenvx --version
  prompt: Install the standalone Dotenvx binary from https://dotenvx.sh. Detect my operating system and architecture, download the matching binary, put it in an appropriate location on my PATH, and verify with dotenvx --version. If I request a specific version, append ?version=vVERSION to the download URL. Do not change my .env files.
  description: To pin a version, append ?version=vVERSION to the download URL, replacing VERSION with your desired release number. The install command puts dotenvx on your PATH at /usr/local/bin.
