{% comment %}
  Homepage-style copyable command for CLI docs heroes.
  locals: command (required)
{% endcomment %}
{% assign command = include.command | strip %}
{% assign command_display = "$ " | append: command %}

<div class="docs-cli-hero-command">
  <div class="docs-hero-mark-frame docs-hero-mark-frame--command">
    <button
      type="button"
      class="docs-cli-hero-command-copy"
      data-docs-cli-hero-copy
      data-copy="{{ command | escape }}"
      aria-label="Copy {{ command | escape }}"
    >
      {% include components/design-code.html value=command_display %}
    </button>
  </div>
</div>
