<style>
  /* Sparse ascii visual — don't inherit the 17rem/23rem hero media slot */
  .blog-design-hero .design-hero-visual {
    min-height: 8.5rem;
  }

  .blog-hero-ascii {
    align-items: center;
    display: flex;
    height: 100%;
    justify-content: center;
    min-height: inherit;
    width: 100%;
  }

  .blog-hero-ascii-art {
    color: var(--design-ink);
    font-family: var(--design-font-mono);
    font-size: var(--design-text-display);
    font-weight: 400;
    letter-spacing: 0.12em;
    line-height: 1;
    margin: 0;
    text-align: center;
    user-select: none;
    white-space: pre;
  }

  @media (min-width: 900px) {
    .blog-design-hero .design-hero-visual {
      min-height: 23rem;
    }

    .blog-hero-ascii {
      height: 100%;
      min-height: inherit;
    }
  }
</style>

{% capture blog_hero_visual %}
  <div class="blog-hero-ascii" aria-hidden="true">
    <pre class="blog-hero-ascii-art">##</pre>
  </div>
{% endcapture %}

{% include components/design-hero.html
  class="blog-design-hero"
  eyebrow=include.eyebrow
  title=include.title
  description=include.description
  shell_class=include.shell_class
  visual=blog_hero_visual
%}
