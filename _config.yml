url: "https://dotenvx.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/" # the subpath of your site, e.g. /blog
title: "Dotenvx" # the name of your site, e.g. ACME Corp.
title_separator: "· "
logo: "/logo.png"
lang: en-US
description: "Encrypt your secrets. Ship them with your code."

# For SEO Jekyll Plugin
author:
  name: Dotenvx
social:
  name: Dotenvx
  links:
    - https://github.com/dotenvx
    - https://www.youtube.com/@dotenvx

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# For Favicon Plugin
favicon:
  source: "favicon.png"

# Exclude files
exclude:
  - .DS_Store
  - README.md
  - DEVELOPMENT.md
  - package.json
  - package-lock.json
  - Procfile.dev
  - bin
  - scripts

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: [apos, apos, quot, quot]
  # Preserve literal hyphens in command-line flags and separators.
  typographic_symbols:
    ndash: "--"
    mdash: "---"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: false

highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-favicon
  - jekyll-feed
  - jemoji
  - jekyll-gzip
  - jekyll-loading-lazy

# include well-known, otherwise jekyll ignore . folders and files
include:
  - .well-known
