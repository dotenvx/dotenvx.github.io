<style>
  .pricing-hero-media {
    align-items: center;
    display: flex;
    height: 100%;
    justify-content: center;
    min-height: inherit;
    width: 100%;
  }

  .pricing-hero-video {
    background: #000;
    display: block;
    height: 17rem;
    max-width: 100%;
    object-fit: cover;
    width: 100%;
  }

  @media (min-width: 768px) {
    .pricing-hero-video {
      height: 23rem;
    }
  }
</style>

{% capture pricing_hero_visual %}
  <div class="pricing-hero-media">
    <video
      class="pricing-hero-video"
      src="/dotenvx-la-office-desk.mp4"
      autoplay
      muted
      loop
      playsinline
      aria-label="dotenvx Los Angeles office desk"
    ></video>
  </div>
{% endcapture %}

{% include components/design-hero.html
  eyebrow="Dotenvx Armor ⛨"
  title="Pricing"

%}
