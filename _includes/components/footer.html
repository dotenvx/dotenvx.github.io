<footer class="footer">
  <div class="armor-shell footer-inner">
    <p class="design-list-title">{{ site.data.footer.title }}</p>
    <p class="footer-cloud">
      {%- for link in site.data.footer.links %}
      <span class="footer-item"><a class="design-link" href="{{ link.href }}"{% if link.external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>{% unless forloop.last %}<span class="footer-sep" aria-hidden="true">&nbsp;·</span>{% endunless %}</span>
      {%- endfor %}
    </p>
  </div>
</footer>
