<style>
  .pricing-design-hero .design-hero-visual {
    min-height: 0;
  }

  .pricing-hero-media {
    align-items: center;
    display: flex;
    height: 100%;
    justify-content: center;
    width: 100%;
  }

  .pricing-hero-video {
    /* Native desk footage is portrait 2560×3184 */
    aspect-ratio: 2560 / 3184;
    background: #000;
    display: block;
    height: auto;
    max-width: 100%;
    object-fit: cover;
    width: 25%;
  }

  @media (min-width: 900px) {
    .pricing-design-hero .design-hero-visual {
      min-height: 23rem;
    }

    .pricing-hero-video {
      height: 23rem;
      width: 100%;
    }
  }
</style>

{% capture pricing_hero_visual %}
  <div class="pricing-hero-media">
    <video
      class="pricing-hero-video"
      src="/dotenvx-la-office-desk.mp4"
      autoplay
      muted
      loop
      playsinline
      aria-label="dotenvx Los Angeles office desk"
    ></video>
  </div>
{% endcapture %}

{% include components/design-hero.html
  class="pricing-design-hero"
  eyebrow="Armor ⛨"
  title="Pricing"
  description="Dotenvx is free and open source. But you can pay for Dotenvx Armor."
  visual=pricing_hero_visual
%}
