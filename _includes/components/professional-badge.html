<a class="professional-badge" href="{{ include.href | escape }}" aria-label="{{ include.name | escape }} — Professional member, visit profile">
  <span class="professional-badge-face">
  <span class="professional-badge-avatar">
    <img src="{{ include.image | escape }}" alt="" width="80" height="80" loading="lazy">
  </span>
  <span class="professional-badge-label"><span class="professional-badge-initials">{{ include.initials | escape }}</span><span class="professional-badge-mark">.ENV</span></span>
  </span>
</a>
