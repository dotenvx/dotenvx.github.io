<a class="professional-nameplate" href="{{ include.href | escape }}" aria-label="{{ include.name | escape }} — Professional member, visit profile">
  <span class="professional-nameplate-avatar">
    <img src="{{ include.image | escape }}" alt="" width="64" height="64" loading="lazy">
  </span>
  <span class="professional-nameplate-initials">{{ include.initials | escape }}</span>
  <span class="professional-nameplate-mark">.ENV</span>
</a>
