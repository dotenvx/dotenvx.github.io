<meta name="theme-color" content="{% if page.force_light %}#fafafa{% else %}#0e1116{% endif %}">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var MODES = ['light', 'dark', 'storm']
    var FORCE_LIGHT = {{ page.force_light | default: false | jsonify }}

    function cookieDomain() {
      var host = location.hostname
      if (host === 'dotenvx.com' || host.slice(-12) === '.dotenvx.com') return '.dotenvx.com'
      return ''
    }

    function readCookie(name) {
      var parts = document.cookie.split(';')
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i].replace(/^\s+/, '')
        if (part.indexOf(name + '=') === 0) {
          return decodeURIComponent(part.slice(name.length + 1))
        }
      }
      return null
    }

    function persistThemeMode(mode) {
      try { localStorage.setItem('themeMode', mode) } catch (e) {}
      var cookie = 'themeMode=' + encodeURIComponent(mode) + '; Path=/; Max-Age=31536000; SameSite=Lax'
      var domain = cookieDomain()
      if (domain) cookie += '; Domain=' + domain
      if (location.protocol === 'https:') cookie += '; Secure'
      document.cookie = cookie
    }

    function readThemeMode() {
      var fromCookie = readCookie('themeMode')
      var fromStore = null
      try { fromStore = localStorage.getItem('themeMode') } catch (e) {}
      return fromCookie || fromStore
    }

    function resolveThemeMode() {
      if (FORCE_LIGHT) return 'light'
      var stored = readThemeMode()
      var mode = MODES.indexOf(stored) !== -1 ? stored : 'storm'
      persistThemeMode(mode)
      return mode
    }

    function applyThemeMode(mode) {
      if (FORCE_LIGHT) mode = 'light'
      var root = document.documentElement
      var themeColor = mode === 'storm' ? '#0e1116' : mode === 'dark' ? '#050505' : '#fafafa'
      root.classList.toggle('dark', mode === 'dark' || mode === 'storm')
      root.classList.toggle('storm', mode === 'storm')
      root.style.backgroundColor = themeColor
      root.style.colorScheme = mode === 'light' ? 'light' : 'dark'
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', themeColor)
      try {
        window.dispatchEvent(new CustomEvent('radar:theme-change', { detail: { mode: mode } }))
      } catch (e) {}
    }

    window.__radarThemeMode = window.__radarThemeMode || {}
    window.__radarThemeMode.modes = MODES
    window.__radarThemeMode.resolve = resolveThemeMode
    window.__radarThemeMode.persist = persistThemeMode
    window.__radarThemeMode.apply = applyThemeMode
    window.__radarThemeMode.next = function (mode) {
      var i = MODES.indexOf(mode)
      return MODES[(i + 1) % MODES.length]
    }
    window.__radarThemeMode.prev = function (mode) {
      var i = MODES.indexOf(mode)
      return MODES[(i - 1 + MODES.length) % MODES.length]
    }

    try {
      applyThemeMode(resolveThemeMode())
    } catch (e) {
      if (FORCE_LIGHT) document.documentElement.classList.remove('dark', 'storm')
      else document.documentElement.classList.add('dark', 'storm')
    }
  })()
</script>
