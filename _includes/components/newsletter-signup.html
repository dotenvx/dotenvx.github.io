<section class="newsletter-signup" aria-label="Dotenvx newsletter">
  <h2 class="design-list-title">Keep up with Dotenvx.</h2>
  <p class="design-paragraph">Product updates and practical guides, occasionally. Unsubscribe anytime.</p>
  <form action="https://armor.dotenvx.com/public/newsletter/subscribe" method="post" data-newsletter-form>
    <input type="hidden" name="source" value="{{ include.source | default: 'blog' }}">
    <label class="newsletter-email-label">
      <span>Email address</span>
      <input type="email" name="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
    </label>
    <div class="newsletter-honeypot" aria-hidden="true">
      <label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    </div>
    <button type="submit" class="design-btn">Subscribe</button>
    <p class="newsletter-status design-paragraph" role="status" aria-live="polite" data-newsletter-status></p>
    <noscript><p class="design-paragraph">Submitting opens Armor to request your confirmation email.</p></noscript>
  </form>
</section>
<script src="{{ '/assets/js/newsletter-signup.js' | relative_url }}" defer></script>
